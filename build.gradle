plugins {
    id 'application'
    id 'java'
}

group = 'com.mineclone'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    lwjglNatives = 'natives-windows'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-openal'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"

    implementation "org.joml:joml:$jomlVersion"

    // MP3-декодер для музыки из assets/music: stb_vorbis умеет только OGG.
    implementation "com.googlecode.soundlibs:jlayer:$jlayerVersion"
}

application {
    mainClass = 'com.mineclone.Main'
    applicationDefaultJvmArgs = [
        '-Dorg.lwjgl.util.NoChecks=false',
        "-Dmineclone.appDir=${projectDir.absolutePath}"
    ]
}

def generatedSources = layout.buildDirectory.dir('generated/sources/buildInfo/java')
def buildInfoTemplate = layout.projectDirectory.file('src/main/java/com/mineclone/core/BuildInfo.java.template')
def gitSha = providers.provider {
    try {
        def result = providers.exec {
            commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : 'unknown'
    } catch (Exception ignored) { return 'unknown' }
}
tasks.register('generateBuildInfo') {
    inputs.file(buildInfoTemplate)
    inputs.property('version', project.version.toString())
    inputs.property('gitSha', gitSha)
    outputs.dir(generatedSources)
    doLast {
        def output = generatedSources.get().file('com/mineclone/core/BuildInfo.java').asFile
        output.parentFile.mkdirs()
        output.setText(buildInfoTemplate.asFile.getText('UTF-8')
                .replace('@VERSION@', project.version.toString())
                .replace('@GIT_SHA@', gitSha.get()), 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedSources)
tasks.named('compileJava') { dependsOn tasks.named('generateBuildInfo') }

tasks.register('mineTests', JavaExec) {
    group = 'verification'
    description = 'Runs the headless zero-dependency regression suite.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mineclone.TestMain'
    workingDir = projectDir
    systemProperty 'mineclone.testReport', layout.projectDirectory.file('out-test/test-report.txt').asFile.absolutePath
    if (providers.gradleProperty('testOnly').isPresent()) args '--only', providers.gradleProperty('testOnly').get()
    if (providers.gradleProperty('testSkip').isPresent()) args '--skip', providers.gradleProperty('testSkip').get()
    if (providers.gradleProperty('testList').isPresent()) args '--list'
}
// No JUnit discovery: `test` delegates to the same real runner as `mineTests`.
tasks.named('test') { dependsOn tasks.named('mineTests'); enabled = false }
tasks.named('check') { dependsOn tasks.named('mineTests') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes 'Main-Class': 'com.mineclone.Main'
    }
}

def appName = 'Mineclone'
def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageOutputDir = layout.buildDirectory.dir('jpackage')

// Sync, not Copy: Copy leaves behind whatever an earlier build put here, and a
// stale LWJGL jar beside the current one ships a release with two versions of
// the same classes on the classpath.
tasks.register('prepareJpackageInput', Sync) {
    dependsOn tasks.named('jar')
    into jpackageInputDir

    from(tasks.named('jar').flatMap { it.archiveFile }) {
        rename { "${appName}.jar" }
    }
    into('lib') {
        from configurations.runtimeClasspath
    }
    into('assets') {
        from 'assets'
        exclude 'atlas.png'
    }
}

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Builds a portable Windows app image with Mineclone.exe.'
    dependsOn tasks.named('prepareJpackageInput')

    doFirst {
        delete layout.buildDirectory.dir("jpackage/${appName}")
    }

    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--app-version', project.version.toString().replaceAll('-.*', ''),
            '--vendor', 'Mineclone',
            '--dest', jpackageOutputDir.get().asFile.absolutePath,
            '--input', jpackageInputDir.get().asFile.absolutePath,
            '--main-jar', "${appName}.jar",
            '--main-class', 'com.mineclone.Main',
            '--java-options', '-Dorg.lwjgl.util.NoChecks=false',
            '--java-options', '-Dmineclone.appDir=$APPDIR'
}

tasks.register('portableZip', Zip) {
    group = 'distribution'
    description = 'Builds a zip containing the portable app image.'
    dependsOn tasks.named('jpackage')
    archiveBaseName = appName
    archiveClassifier = 'windows-portable'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir("jpackage/${appName}")) {
        into appName
    }
}

tasks.register('serverZip', Zip) {
    group = 'distribution'
    description = 'Builds the standalone Java 17 dedicated server archive.'
    dependsOn tasks.named('jar')
    archiveBaseName = 'Mineclone'
    archiveClassifier = 'server'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('Mineclone-server') {
        from(tasks.named('jar').flatMap { it.archiveFile }) { rename { 'Mineclone.jar' } }
        into('lib') { from configurations.runtimeClasspath }
        into('assets/data') { from 'assets/data' }
        from('tools/server-package')
    }
}
