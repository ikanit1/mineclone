name: CI

on:
  push:
    branches: [master, develop-1.1]
  pull_request:
    branches: [master, develop-1.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: libs
          key: jars-windows-${{ hashFiles('gradle.properties', 'tools/build-common.ps1') }}
      - name: Compile without opening a window
        run: ./run.ps1 -CompileOnly
      - name: Headless regression suite
        run: ./run-tests.ps1
      - name: Verify runner filters and failure exit
        run: ./tools/TestRunnerCli.ps1
      - name: Verify benchmark launcher aggregation and GC parsing
        run: |
          New-Item -ItemType Directory -Force out-test/bench-tools | Out-Null
          javac --release 17 -encoding UTF-8 -cp 'out-test;libs/*' -d out-test/bench-tools tools/BenchScenes.java tools/BenchScenesTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark tools did not compile' }
          java -cp 'out-test/bench-tools;out-test;libs/*' BenchScenesTest
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark launcher checks failed' }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: out-test/test-report.txt
          if-no-files-found: warn
